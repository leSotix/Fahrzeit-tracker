<script src="vendor/leaflet/leaflet.js"></script>
<script>
(() => {
  'use strict';
  const K = { rides: 'fahrzeit.rides.v2', places: 'fahrzeit.places.v1', vars: 'fahrzeit.variants.v1', active: 'fahrzeit.active.v2', geo: 'fahrzeit.geo.v2' };
  const K_OLD = { rides: 'fahrzeit.rides.v1', active: 'fahrzeit.active.v1', geo: 'fahrzeit.geo.v1' };
  const PROMPT_AFTER_MS = 7 * 60 * 1000;   // fallback prompt when no Abfragepunkt applies
  const NEW_PLACE_R = 700;                 // radius for places the app creates by itself
  const ASK_R = 1500;                      // default radius of an Abfragepunkt
  const MAX_SPEED = 36;                    // m/s ≈ 130 km/h — the fastest we could approach an Abfragepunkt
  const GEO_MIN_GAP = 15000, GEO_MAX_GAP = 3 * 60000, GEO_RETRY = 30000;
  const RADII = [300, 500, 700, 1000, 1500, 2000, 3000, 5000];

  // Seeds = what the first version had built in (coordinates from OpenStreetMap; r = radius in metres).
  // Ulm and Unterstadion become ordinary places, Risstissen and Donautal ordinary Varianten.
  const SEED_PLACES = [
    { id: 'p-ulm', name: 'Ulm', lat: 48.3985, lon: 9.9912, r: 3000 },
    { id: 'p-unterstadion', name: 'Unterstadion', lat: 48.2036, lon: 9.6884, r: 2500 },
  ];
  const SEED_VARIANTS = [
    { id: 'v-risstissen', name: 'Risstissen', no: 'direkt', lat: 48.2706, lon: 9.8306, onlyFrom: [], ask: [
      { name: 'Laupheim', lat: 48.2301, lon: 9.8837, r: 4000 },
      { name: 'Untersulmetingen', lat: 48.2307, lon: 9.8263, r: 1500 } ] },
    { id: 'v-donautal', name: 'Donautal', no: 'B 10', lat: 48.3607, lon: 9.9683, onlyFrom: ['p-unterstadion'], ask: [
      { name: 'Ausfahrt Ulm-Donautal', lat: 48.3607, lon: 9.9683, r: 1000 } ] },
  ];

  const $ = s => document.querySelector(s);
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const clone = o => JSON.parse(JSON.stringify(o));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const num = n => typeof n === 'number' && isFinite(n);

  // ---------- data ----------
  /** ride:  {id, start, end, from: placeId|null, to: placeId|null, a: {variantId: true|false}, sp?: [lat,lon,acc], ep?: [lat,lon,acc]} newest first
   *  place: {id, name, lat, lon, r, unnamed?}
   *  variant: {id, name, no ('' = "ohne <name>"), lat, lon, onlyFrom: [placeId], ask: [{name, lat, lon, r}]} */
  function cleanRide(r) {
    if (!r || !num(r.start) || !num(r.end) || !(r.end > r.start)) return null;
    const o = { id: typeof r.id === 'string' && r.id ? r.id : uid(), start: r.start, end: r.end, from: null, to: null, a: {} };
    const pos = p => Array.isArray(p) && p.length >= 2 && p.slice(0, 3).every(num) ? p.slice(0, 3) : null;
    if (r.a && typeof r.a === 'object') {
      if (typeof r.from === 'string') o.from = r.from;
      if (typeof r.to === 'string') o.to = r.to;
      for (const [k, v] of Object.entries(r.a)) if (typeof v === 'boolean') o.a[k] = v;
      const sp = pos(r.sp), ep = pos(r.ep);
      if (sp) o.sp = sp;
      if (ep) o.ep = ep;
    } else {   // first version: Ulm ↔ Unterstadion, über Risstissen?, B 10 / Donautal
      if (typeof r.risstissen === 'boolean') o.a['v-risstissen'] = r.risstissen;
      if (r.via === 'b10' || r.via === 'donautal') o.a['v-donautal'] = r.via === 'donautal';
      if (r.from === 'ulm') { o.from = 'p-ulm'; o.to = 'p-unterstadion'; }
      else if (r.from === 'unterstadion') { o.from = 'p-unterstadion'; o.to = 'p-ulm'; }
    }
    return o;
  }
  const cleanPlace = p => p && typeof p.id === 'string' && typeof p.name === 'string' && num(p.lat) && num(p.lon)
    ? { id: p.id, name: p.name, lat: p.lat, lon: p.lon, r: num(p.r) ? p.r : NEW_PLACE_R, ...(p.unnamed ? { unnamed: true } : {}) } : null;
  const cleanVariant = v => v && typeof v.id === 'string' && typeof v.name === 'string' && num(v.lat) && num(v.lon) ? {
    id: v.id, name: v.name, no: typeof v.no === 'string' ? v.no : '', lat: v.lat, lon: v.lon,
    onlyFrom: Array.isArray(v.onlyFrom) ? v.onlyFrom.filter(x => typeof x === 'string') : [],
    ask: Array.isArray(v.ask) ? v.ask.filter(a => a && num(a.lat) && num(a.lon))
      .map(a => ({ name: typeof a.name === 'string' ? a.name : 'Abfragepunkt', lat: a.lat, lon: a.lon, r: num(a.r) ? a.r : ASK_R })) : [],
  } : null;

  let places = load(K.places, null), variants = load(K.vars, null), rides = load(K.rides, null);
  /** active: {start, from: null (locating)|'none' (no fix)|'new' (unknown spot)|placeId, sp, a: {vid: bool}, hit: {askKey: true}, snoozed: {vid: true}} */
  let active = load(K.active, null);
  let migrated = false;
  if (!Array.isArray(rides)) {
    rides = (load(K_OLD.rides, []) || []).map(cleanRide).filter(Boolean);
    const oa = load(K_OLD.active, null);
    if (oa && num(oa.start) && !active) {
      active = { start: oa.start, sp: null, a: {}, hit: {}, snoozed: {},
        from: oa.from === 'ulm' ? 'p-ulm' : oa.from === 'unterstadion' ? 'p-unterstadion' : oa.from ? 'none' : null };
      if (typeof oa.route === 'boolean') active.a['v-risstissen'] = oa.route;
      if (oa.via === 'b10' || oa.via === 'donautal') active.a['v-donautal'] = oa.via === 'donautal';
    }
    migrated = true;
  }
  if (!Array.isArray(places)) { places = clone(SEED_PLACES); migrated = true; }
  if (!Array.isArray(variants)) { variants = clone(SEED_VARIANTS); migrated = true; }
  places = places.map(cleanPlace).filter(Boolean);
  variants = variants.map(cleanVariant).filter(Boolean);
  if (active) { active.a ??= {}; active.hit ??= {}; active.snoozed ??= {}; active.sp ??= null; }
  let geoOn = load(K.geo, null);
  if (typeof geoOn !== 'boolean') geoOn = true;   // locations are what routes are made of — on unless switched off

  function persist() {
    try {
      localStorage.setItem(K.rides, JSON.stringify(rides));
      localStorage.setItem(K.places, JSON.stringify(places));
      localStorage.setItem(K.vars, JSON.stringify(variants));
      if (active) localStorage.setItem(K.active, JSON.stringify(active));
      else localStorage.removeItem(K.active);
    } catch { toast('Speichern fehlgeschlagen!'); }
  }
  function saveGeo() { try { localStorage.setItem(K.geo, JSON.stringify(geoOn)); } catch {} }
  if (migrated) { persist(); try { localStorage.removeItem(K_OLD.active); } catch {} }   // old rides stay as a backup
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

  const P = id => (id ? places.find(p => p.id === id) : undefined);
  const V = id => variants.find(v => v.id === id);
  // A Strecke has no direction: Ulm → Unterstadion and Unterstadion → Ulm are the same Strecke.
  const routeKey = r => (P(r.from) && P(r.to) ? [r.from, r.to].sort().join('|') : '?');
  const pname = id => (P(id) ? P(id).name : '?');
  const routeName = (f, t) => `${pname(f)} → ${pname(t)}`;
  /** both ends of a Strecke, in the direction driven most often */
  function routeEnds(k) {
    const [a, b] = k.split('|');
    let ab = 0, ba = 0;
    for (const r of rides) { if (r.from === a && r.to === b) ab++; else if (r.from === b && r.to === a) ba++; }
    return ab >= ba ? [a, b] : [b, a];
  }
  const routeTitle = k => { const [f, t] = routeEnds(k); return `${pname(f)} ↔ ${pname(t)}`; };
  const noLabel = v => v.no || `ohne ${v.name}`;
  const noTag = v => (v.no ? cap(v.no) : `Ohne ${v.name}`);

  // ---------- formatting ----------
  const p2 = n => String(n).padStart(2, '0');
  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h ? `${h}:${p2(m)}:${p2(ss)}` : `${p2(m)}:${p2(ss)}`;
  }
  const fmtClock = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  // ---------- geometry ----------
  function dist(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  const pt = pos => ({ lat: pos[0], lon: pos[1] });

  function matchPlace(pos) {
    const here = pt(pos), slack = Math.min(pos[2] || 0, 200);
    let best = null, bd = Infinity;
    for (const p of places) { const d = dist(here, p); if (d <= p.r + slack && d < bd) { best = p; bd = d; } }
    return best;
  }
  const newPlaceName = () => { let i = 1, n = 'Neuer Ort'; while (places.some(p => p.name === n)) n = `Neuer Ort ${++i}`; return n; };
  /** the place at pos — an existing one, or a new one named from the map */
  function placeAt(pos) {
    const m = matchPlace(pos);
    if (m) return m.id;
    if ((pos[2] || 0) > 800) return null;   // too vague to found a place on
    const p = { id: uid(), name: newPlaceName(), lat: +pos[0].toFixed(5), lon: +pos[1].toFixed(5), r: NEW_PLACE_R, unnamed: true };
    places.push(p);
    nameFromMap(p);
    return p.id;
  }

  /** Places this one is linked to by a Strecke (either direction), most frequent first. */
  function destinationsFrom(fid) {
    const n = new Map();
    for (const r of rides) {
      const other = r.from === fid ? r.to : r.to === fid ? r.from : null;
      if (P(other) && other !== fid) n.set(other, (n.get(other) || 0) + 1);
    }
    return [...n.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  }
  /** Which Varianten make sense between start and destination(s): the via point may not be a big detour. */
  function relevant(fromId, toIds, fromPos) {
    const F = P(fromId) || (fromPos ? pt(fromPos) : null);
    const Ts = toIds.map(P).filter(Boolean);
    return variants.filter(v => {
      if (v.onlyFrom.length && !v.onlyFrom.includes(fromId)) return false;
      if (!F) return true;
      if (!Ts.length) return dist(F, v) <= 60000;
      return Ts.some(T => dist(F, v) + dist(v, T) <= dist(F, T) * 1.4 + 3000);
    });
  }
  function rideVariants(r) {
    const f = P(r.from) ? r.from : null;
    const list = relevant(f, P(r.to) ? [r.to] : f ? destinationsFrom(f) : [], r.sp);
    for (const id of Object.keys(r.a || {})) { const v = V(id); if (v && !list.includes(v)) list.push(v); }
    return list;
  }
  const activeVariants = () => (active ? rideVariants({ from: active.from, to: null, sp: active.sp, a: active.a }) : []);

  // ---------- OpenStreetMap search (Nominatim) ----------
  async function osm(path, params) {
    const u = new URL('https://nominatim.openstreetmap.org/' + path);
    for (const [k, v] of Object.entries({ format: 'jsonv2', 'accept-language': 'de', ...params })) u.searchParams.set(k, v);
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    try { const r = await fetch(u, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  /** kind 'local' → district (Eselsberg), 'town' → village / town (Ehingen) */
  async function revName(lat, lon, kind) {
    try {
      const j = await osm('reverse', { lat, lon, zoom: kind === 'local' ? 16 : 13, addressdetails: 1 });
      const a = j.address || {};
      return (kind === 'local'
        ? a.suburb || a.quarter || a.village || a.hamlet || a.town || a.city_district || a.city
        : a.village || a.town || a.hamlet || a.suburb || a.city || a.municipality) || j.name || null;
    } catch { return null; }
  }
  async function nameFromMap(p) {
    let n = await revName(p.lat, p.lon, 'local');
    if (!n || !p.unnamed || !places.includes(p)) return;
    if (places.some(q => q !== p && q.name === n)) n += ' 2';
    p.name = n; delete p.unnamed;
    persist(); render(); drawMap();
  }

  // ---------- audio chime (unlocked on Start tap) ----------
  let actx = null;
  function unlockAudio() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'transient';
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      g.gain.value = 0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.02);
    } catch {}
  }
  function chime() {
    if (!actx) return;
    try {
      actx.resume();
      const t = actx.currentTime;
      [[784, 0], [1047, 0.2], [1319, 0.4]].forEach(([f, d]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.5, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.45);
        o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + 0.5);
      });
    } catch {}
  }

  // ---------- keep screen awake while riding ----------
  let wakeLock = null;
  async function wake() {
    try {
      if (!wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }
  function unwake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

  // ---------- location during a ride ----------
  // Only foreground sampling is possible for a web app: while the screen is on (the wake lock keeps it on
  // during a ride). If the phone was locked, the first fix after unlocking catches up via the "passed" check.
  const hasGeo = 'geolocation' in navigator;
  let lastFix = null;   // {lat, lon, acc, t}
  let promptMode = null;     // 'auto' | 'manual' | 'stop'
  let promptVid = null;
  let promptOpenedAt = 0;
  let autoQueue = [];        // [{vid, kick}] prompts waiting while another prompt is open
  let stopQueue = null;      // variant ids left to ask before saving, while stopping
  let stopTotal = 0;
  let stopAt = null;
  let endFix = null;         // {pos, rideId} — the position where a ride ended
  let lastTap = 0;

  const located = () => !!active && active.from !== null && active.from !== 'none';
  function pendingAsks() {
    if (!geoOn || !located()) return [];
    const out = [];
    for (const v of activeVariants()) {
      if (active.a[v.id] !== undefined) continue;
      v.ask.forEach((p, i) => { const key = v.id + ':' + i; if (!active.hit[key]) out.push({ v, p, key }); });
    }
    return out;
  }
  const geoWanted = () => hasGeo && geoOn && !!active && !stopQueue && (active.from === null || pendingAsks().length > 0);

  let geoTimer = null, geoReq = 0, geoBusyUntil = 0;
  function geoSync() {
    if (!geoWanted()) { clearTimeout(geoTimer); geoTimer = null; return; }
    if (!geoTimer && Date.now() >= geoBusyUntil) geoSample();
  }
  function geoLater(ms) { clearTimeout(geoTimer); geoTimer = setTimeout(geoSample, ms); }
  function geoSample() {
    clearTimeout(geoTimer); geoTimer = null;
    if (!geoWanted() || document.visibilityState !== 'visible') return; // resumes on visibilitychange
    if (Date.now() < geoBusyUntil) return geoLater(geoBusyUntil - Date.now() + 100);
    const id = ++geoReq, ride = active.start;
    geoBusyUntil = Date.now() + 30000;   // a request that never answers must not block sampling forever
    const done = fn => arg => {
      if (id !== geoReq) return;
      geoBusyUntil = 0;
      if (active && active.start === ride) fn(arg); else geoSync();
    };
    navigator.geolocation.getCurrentPosition(done(onFix), done(onGeoError),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  }
  function onFix({ coords: c }) {
    const here = { lat: c.latitude, lon: c.longitude }, acc = c.accuracy || 0;
    lastFix = { ...here, acc, t: Date.now() };
    if (active.from === null) {
      active.sp = [+here.lat.toFixed(5), +here.lon.toFixed(5), Math.round(acc)];
      const m = matchPlace(active.sp);
      active.from = m ? m.id : 'new';
    }
    const slack = Math.min(acc, 300);
    const dests = P(active.from) ? destinationsFrom(active.from) : [];
    const dest = P(dests[0]);
    for (const { v, p, key } of pendingAsks()) {
      const reached = dist(here, p) - slack <= p.r;
      const passed = !!dest && dist(here, dest) < dist(p, dest) - p.r;   // already beyond it, e.g. the screen was off
      if (!reached && !passed) continue;
      active.hit[key] = true;
      ask(v.id, reached ? p.name : null);
    }
    persist();
    const pend = pendingAsks();
    if (geoWanted() && pend.length) {
      const edge = Math.min(...pend.map(({ p }) => dist(here, p) - p.r));
      geoLater(Math.min(GEO_MAX_GAP, Math.max(GEO_MIN_GAP, edge / MAX_SPEED * 1000 * 0.8)));
    }
    render();
  }
  function onGeoError(e) {
    if (e && e.code === 1) {   // permission denied → no routes, Varianten after 7 minutes
      geoOn = false; saveGeo(); render();
      return toast('Standort nicht erlaubt – Strecken werden nicht erkannt');
    }
    geoLater(GEO_RETRY);
  }
  /** Where the ride ended: a fresh fix (it may arrive after the ride is saved); the last sample only if that fails. */
  function captureEnd() {
    const e = endFix = { pos: null, rideId: null };
    if (!geoOn || !hasGeo) return;
    const fallback = lastFix && Date.now() - lastFix.t < 120000 && lastFix.t >= active.start
      ? [+lastFix.lat.toFixed(5), +lastFix.lon.toFixed(5), Math.round(lastFix.acc)] : null;
    const got = pos => {
      if (endFix !== e || !pos) return;
      e.pos = pos;
      const r = e.rideId && rides.find(x => x.id === e.rideId);
      if (r && !r.ep) { applyEnd(r, pos); persist(); render(); drawMap(); }
    };
    navigator.geolocation.getCurrentPosition(
      ({ coords: c }) => got([+c.latitude.toFixed(5), +c.longitude.toFixed(5), Math.round(c.accuracy || 0)]),
      () => got(fallback),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
  }
  function applyEnd(ride, pos) { ride.ep = pos; if (!ride.to) ride.to = placeAt(pos); }

  $('#geoBtn').addEventListener('click', () => {
    if (geoOn) { geoOn = false; saveGeo(); render(); return toast('Standort aus'); }
    if (!hasGeo) return toast('Standort wird nicht unterstützt');
    // asks for permission now, from a tap, rather than mid-ride
    navigator.geolocation.getCurrentPosition(
      () => { geoOn = true; saveGeo(); render(); toast('Standort an'); },
      e => {
        if (e.code === 1) return toast('Standortzugriff nicht erlaubt');
        geoOn = true; saveGeo(); render(); toast('Standort an · noch kein Signal');
      },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
  });

  // ---------- ride control ----------
  function startRide() {
    unlockAudio();
    active = { start: Date.now(), from: null, sp: null, a: {}, hit: {}, snoozed: {} };
    autoQueue = []; endFix = null;
    persist(); wake(); render();   // render → geoSync takes the first fix right away
  }
  function requestStop() {
    stopAt = Date.now();
    autoQueue = [];
    captureEnd();
    stopQueue = activeVariants().filter(v => active.a[v.id] === undefined).map(v => v.id);
    stopTotal = stopQueue.length;
    nextStopQuestion();
  }
  function nextStopQuestion() {
    const vid = stopQueue && stopQueue.shift();
    if (vid) openPrompt('stop', vid);
    else { stopQueue = null; finishRide(); }
  }
  function finishRide() {
    const ride = { id: uid(), start: active.start, end: stopAt || Date.now(), from: null, to: null, a: {} };
    for (const [k, v] of Object.entries(active.a)) if (V(k) && typeof v === 'boolean') ride.a[k] = v;
    if (active.sp) { ride.sp = active.sp; ride.from = P(active.from) ? active.from : placeAt(active.sp); }
    else if (P(active.from)) ride.from = active.from;
    const prev = clone(active);
    rides.unshift(ride);
    if (endFix) { endFix.rideId = ride.id; if (endFix.pos) applyEnd(ride, endFix.pos); }
    active = null; stopAt = null; stopQueue = null; autoQueue = [];
    persist(); unwake(); render(); drawMap();
    toast(`Gespeichert · ${fmtDur(ride.end - ride.start)}`, 'Rückgängig', () => {
      rides = rides.filter(r => r.id !== ride.id);
      endFix = null; active = prev; persist(); wake(); render();
    });
  }
  function discardRide() {
    if (!confirm('Diese Fahrt verwerfen? Sie wird nicht gespeichert.')) return;
    active = null; stopAt = null; stopQueue = null; autoQueue = []; endFix = null;
    persist(); unwake(); render();
  }

  $('#mainBtn').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 800) return; // guard against double taps
    lastTap = now;
    active ? requestStop() : startRide();
  });
  $('#discardBtn').addEventListener('click', discardRide);

  // ---------- variant prompt ----------
  function setBig(btn, [cls, big, small]) {
    btn.className = 'big plate ' + cls;
    btn.querySelector('.bk').textContent = big;
    btn.querySelector('.bs').textContent = small;
  }
  function openPrompt(mode, vid, kick) {
    const v = V(vid);
    if (!v || !active) return;
    promptMode = mode; promptVid = vid;
    promptOpenedAt = Date.now();
    const mins = Math.floor((Date.now() - active.start) / 60000);
    $('#pKick').textContent = mode === 'stop'
      ? (stopTotal > 1 ? `Fahrt beenden · ${stopTotal - stopQueue.length} von ${stopTotal}` : 'Fahrt beenden')
      : kick || `${mins} Minuten unterwegs`;
    $('#pTitle').textContent = `Über ${v.name}?`;
    setBig($('#pA'), ['r', 'Ja', `über ${v.name}`]);
    setBig($('#pB'), ['d', 'Nein', noLabel(v)]);
    $('#pLater').textContent = mode === 'stop' ? 'Überspringen' : mode === 'auto' ? 'Später' : 'Abbrechen';
    $('#prompt').classList.add('open');
    if (mode === 'auto') chime();
  }
  function closePrompt() { $('#prompt').classList.remove('open'); promptMode = null; }

  // location prompts queue up so that one never replaces another that is still open
  function ask(vid, kick) {
    if (!autoQueue.some(x => x.vid === vid)) autoQueue.push({ vid, kick });
    pumpAsk();
  }
  function pumpAsk() {
    if (promptMode || stopQueue || !active) return;
    while (autoQueue.length) {
      const { vid, kick } = autoQueue.shift();
      if (V(vid) && active.a[vid] === undefined) return openPrompt('auto', vid, kick);
    }
  }

  [$('#pA'), $('#pB')].forEach(b => b.addEventListener('click', () => {
    if (!promptMode || Date.now() - promptOpenedAt < 450) return; // ignore accidental taps as it appears
    const mode = promptMode;
    active.a[promptVid] = b.id === 'pA';
    closePrompt();
    if (mode === 'stop') nextStopQuestion();
    else { persist(); render(); setTimeout(pumpAsk, 400); }
  }));
  $('#pLater').addEventListener('click', () => {
    const mode = promptMode;
    if (mode !== 'stop' && active) { active.snoozed[promptVid] = true; persist(); }
    closePrompt();
    if (mode === 'stop') nextStopQuestion();   // save without this answer
    else setTimeout(pumpAsk, 400);
  });

  // ---------- ticking ----------
  function tick() {
    const t = $('#timer');
    if (!active) { t.textContent = '00:00'; t.classList.remove('long'); return; }
    const el = Date.now() - active.start;
    t.textContent = fmtDur(el);
    t.classList.toggle('long', el >= 3600000);
    if (!promptMode && !stopQueue && el >= PROMPT_AFTER_MS) {
      // no fix within 7 minutes → give up on location for this ride
      if (geoOn && active.from === null) { active.from = 'none'; persist(); geoSync(); renderHero(); }
      // with location, Varianten that have an Abfragepunkt wait for it; all others are asked now
      const guided = geoOn && located();
      const due = activeVariants().filter(v => active.a[v.id] === undefined && !active.snoozed[v.id] && !(guided && v.ask.length));
      if (due.length) { due.forEach(v => { if (!autoQueue.some(x => x.vid === v.id)) autoQueue.push({ vid: v.id, kick: null }); }); pumpAsk(); }
    }
  }
  setInterval(tick, 500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (active) { wake(); if (geoWanted()) geoSample(); } // catch up right away after the screen was off
    tick();
  });

  // ---------- rendering ----------
  const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const tagsFor = r => Object.entries(r.a).map(([id, yes]) => {
    const v = V(id);
    return !v ? '' : yes ? `<span class="tag r">${esc(v.name)}</span>` : `<span class="tag d">${esc(noTag(v))}</span>`;
  }).join('');

  function renderHero() {
    document.body.classList.toggle('running', !!active);
    document.body.classList.toggle('idle', !active);
    $('#mainLbl').textContent = active ? 'Stopp' : 'Start';

    if (active) $('#status').textContent = `Gestartet um ${fmtClock(active.start)}`;
    else if (rides.length) {
      const r = rides[0];
      $('#status').textContent = `Letzte Fahrt: ${fmtDur(r.end - r.start)}` + (routeKey(r) !== '?' ? ` · ${routeName(r.from, r.to)}` : '');
    } else $('#status').textContent = 'Bereit für die Fahrt';

    // location line
    const line = $('#geoLine');
    line.hidden = !(active && geoOn);
    if (!line.hidden) {
      let t;
      if (active.from === null) t = 'Standort wird gesucht …';
      else if (active.from === 'none') t = 'Kein Standort – Start unbekannt';
      else {
        const f = P(active.from), d = f ? P(destinationsFrom(f.id)[0]) : null;
        t = (f ? `Ab ${f.name}` : 'Ab neuem Ort') + (d ? ` → ${d.name}?` : '');
        let pend = pendingAsks();
        if (lastFix) pend = pend.sort((a, b) => dist(lastFix, a.p) - dist(lastFix, b.p));
        if (pend[0]) t += ` · fragt bei ${pend[0].p.name}`;
      }
      $('#geoText').textContent = t;
    }

    // Varianten signs
    const box = $('#routes');
    box.textContent = '';
    if (!active) return;
    let list = activeVariants();
    if (geoOn && active.from === null) list = list.filter(v => active.a[v.id] !== undefined);   // still locating
    box.classList.toggle('two', list.length > 1);
    for (const v of list) {
      const ans = active.a[v.id];
      const b = document.createElement('button');
      b.className = 'route plate' + (ans === true ? ' r set' : ans === false ? ' d set' : '');
      const [k, n] = ans === true ? ['über', v.name]
        : ans === false ? (v.no ? [`ohne ${v.name}`, cap(v.no)] : ['nicht über', v.name])
        : [`Über ${v.name}?`, 'Offen'];
      b.innerHTML = '<span class="k"></span><span class="n"></span>';
      b.querySelector('.k').textContent = k;
      b.querySelector('.n').textContent = n;
      b.setAttribute('aria-label', `Über ${v.name}: ${ans === true ? 'ja' : ans === false ? 'nein' : 'offen'}`);
      b.addEventListener('click', () => active && openPrompt('manual', v.id));
      box.appendChild(b);
    }
  }

  function render() {
    renderHero();
    $('#geoBtn').setAttribute('aria-checked', String(geoOn));
    geoSync();
    tick();
    renderRoutes();
    renderList();
    renderRoute();
    $('#mapSummary').textContent = `${plural(places.length, 'Ort', 'Orte')} · ${plural(variants.length, 'Variante', 'Varianten')} — Varianten wie „über Ehingen“ hinzufügen`;
  }

  function stats(list) {
    if (!list.length) return null;
    const d = list.map(r => r.end - r.start);
    return { n: d.length, avg: d.reduce((a, b) => a + b, 0) / d.length, min: Math.min(...d), max: Math.max(...d) };
  }
  const statHTML = (tag, s) => `<div class="stat">${tag}
    <div class="avg">${s ? `<small>Ø</small>${fmtDur(s.avg)}` : '–'}</div>
    <div class="meta">${s ? `${plural(s.n, 'Fahrt', 'Fahrten')}<dl><dt>Schnellste</dt><dd>${fmtDur(s.min)}</dd><dt>Langsamste</dt><dd>${fmtDur(s.max)}</dd></dl>` : 'Noch keine Fahrten'}</div></div>`;

  function routeGroups() {
    const m = new Map();
    for (const r of rides) { const k = routeKey(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
    return [...m.entries()].map(([k, list]) => ({ k, list, s: stats(list) }))
      .sort((a, b) => (a.k === '?') - (b.k === '?') || b.list.length - a.list.length);
  }
  function renderRoutes() {
    const box = $('#routeList');
    box.textContent = '';
    const groups = routeGroups();
    if (!groups.length) {
      box.innerHTML = '<div class="empty">Noch keine Strecken. Jede Fahrt landet automatisch bei ihrer Strecke – von wo du startest nach wo du ankommst.</div>';
      return;
    }
    for (const g of groups) {
      const b = document.createElement('button');
      const unk = g.k === '?';
      b.className = 'rc' + (unk ? ' unk' : '');
      const [f, t] = unk ? [] : routeEnds(g.k);
      b.innerHTML = `<div><div class="rc-n">${unk ? 'Ohne Strecke' : `${esc(pname(f))} <i>↔</i> ${esc(pname(t))}`}</div>
        <div class="rc-m">${plural(g.s.n, 'Fahrt', 'Fahrten')} · ${unk ? 'antippen zum Zuordnen' : `Bestzeit ${fmtDur(g.s.min)}`}</div></div>
        <div class="rc-a"><small>Ø</small>${fmtDur(g.s.avg)}</div>${ICON_CHEV}`;
      b.addEventListener('click', () => openRoute(g.k));
      box.appendChild(b);
    }
  }

  function rideRow(r, showRoute) {
    const b = document.createElement('button');
    b.className = 'ride';
    const unk = routeKey(r) === '?';
    b.innerHTML = `<div><div class="rdate"></div><div class="rtime"></div>${showRoute || unk ? `<div class="rdir${unk ? ' unk' : ''}"></div>` : ''}</div>
      <div class="rright"><div class="rdur"></div><div class="rtags">${tagsFor(r)}</div></div>${ICON_CHEV}`;
    b.querySelector('.rdate').textContent = fmtDate(r.start);
    b.querySelector('.rtime').textContent = `${fmtClock(r.start)} – ${fmtClock(r.end)}`;
    const dir = b.querySelector('.rdir');
    if (dir) dir.textContent = unk ? (P(r.from) || P(r.to) ? `${routeName(r.from, r.to)} · zuordnen` : 'Strecke unbekannt · zuordnen') : routeName(r.from, r.to);
    b.querySelector('.rdur').textContent = fmtDur(r.end - r.start);
    b.addEventListener('click', () => openRideSheet(r.id));
    return b;
  }
  let showAll = false;
  function renderList() {
    const list = $('#list');
    list.textContent = '';
    if (!rides.length) {
      list.innerHTML = '<div class="empty">Noch keine Fahrten gespeichert. Tippe oben auf Start, wenn du losfährst.</div>';
      $('#moreBtn').hidden = true;
      return;
    }
    const shown = showAll ? rides : rides.slice(0, 15);
    const frag = document.createDocumentFragment();
    shown.forEach(r => frag.appendChild(rideRow(r, true)));
    list.appendChild(frag);
    $('#moreBtn').hidden = shown.length === rides.length;
    $('#moreBtn').textContent = `Alle ${rides.length} Fahrten anzeigen`;
  }
  $('#moreBtn').addEventListener('click', () => { showAll = true; renderList(); });

  // ---------- route detail page ----------
  let routeOpen = null;
  function openRoute(k) {
    routeOpen = k;
    $('#routePage').classList.add('open');
    $('#routePage').scrollTop = 0;
    renderRoute();
  }
  function closeRoute() { routeOpen = null; $('#routePage').classList.remove('open'); }
  $('#rpBack').addEventListener('click', closeRoute);

  function renderRoute() {
    if (!routeOpen) return;
    const list = rides.filter(r => routeKey(r) === routeOpen);
    if (!list.length) return closeRoute();
    const unk = routeOpen === '?';
    const [f, t] = unk ? [] : routeEnds(routeOpen);
    $('#rpTitle').textContent = unk ? 'Ohne Strecke' : routeTitle(routeOpen);
    const body = $('#rpBody');
    let html = '';
    if (unk) {
      html += `<p class="note" style="margin:8px 2px 0">Diesen Fahrten fehlt Start oder Ziel – zum Beispiel weil der Standort aus war. Tippe eine Fahrt an und wähle die Strecke.</p>`;
    } else {
      html += `<h3>Fahrzeit</h3><div class="stats one">${statHTML('', stats(list))}</div>
        <div class="places"><button class="pbtn" data-place="${esc(f)}"><span>Ort</span><b>${esc(pname(f))}</b></button>
        <button class="pbtn" data-place="${esc(t)}"><span>Ort</span><b>${esc(pname(t))}</b></button></div>`;
      // both directions side by side, when both have been driven
      const sTo = stats(list.filter(r => r.from === f)), sBack = stats(list.filter(r => r.from === t));
      if (sTo && sBack && f !== t) {
        const diff = sTo.avg - sBack.avg;
        html += `<h3>Richtungen</h3><div class="stats">${statHTML(`<div class="dirl">${esc(routeName(f, t))}</div>`, sTo)}${statHTML(`<div class="dirl">${esc(routeName(t, f))}</div>`, sBack)}</div>
          <div class="delta">${Math.abs(diff) < 1000 ? 'Beide Richtungen dauern im Schnitt gleich lang.'
            : `Nach ${esc(pname(diff > 0 ? f : t))} brauchst du im Schnitt <b>${fmtDur(Math.abs(diff))} länger</b>.`}</div>`;
      }
      const vs = variants.filter(v => list.some(r => r.a[v.id] !== undefined));
      if (vs.length) {
        html += '<h3>Varianten</h3>';
        for (const v of vs) {
          const sY = stats(list.filter(r => r.a[v.id] === true)), sN = stats(list.filter(r => r.a[v.id] === false));
          let delta = '';
          if (sY && sN) {
            const diff = sY.avg - sN.avg;
            delta = Math.abs(diff) < 1000 ? `Über ${esc(v.name)} und ${esc(noLabel(v))} sind im Schnitt gleich schnell.`
              : `Über ${esc(v.name)} bist du im Schnitt <b>${fmtDur(Math.abs(diff))} ${diff > 0 ? 'langsamer' : 'schneller'}</b> als ${esc(noLabel(v))}.`;
          }
          html += `<div class="cmp"><div class="stats">${statHTML(`<span class="tag r">Über ${esc(v.name)}</span>`, sY)}${statHTML(`<span class="tag d">${esc(noTag(v))}</span>`, sN)}</div>
            ${delta ? `<div class="delta">${delta}</div>` : ''}</div>`;
        }
      }
    }
    html += '<h3>Fahrten</h3><div class="list" id="rpList"></div>';
    body.innerHTML = html;
    body.querySelectorAll('[data-place]').forEach(b => b.addEventListener('click', () => openPlaceSheet(b.dataset.place)));
    const box = body.querySelector('#rpList');
    list.forEach(r => box.appendChild(rideRow(r, false)));
  }

  // ---------- sheets ----------
  function openSheet(sel) {
    document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
    $(sel).classList.add('open');
    $(sel).querySelector('.sheet-c').scrollTop = 0;
  }
  function closeSheets() {
    document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
    rideId = placeId = varId = null;
  }
  document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) closeSheets(); }));
  ['#rsClose', '#psClose', '#vsClose'].forEach(s => $(s).addEventListener('click', closeSheets));

  // ride sheet
  let rideId = null, rideAllVars = false;
  function openRideSheet(id) {
    if (!rides.some(x => x.id === id)) return;
    rideId = id; rideAllVars = false;
    renderRideSheet();
    openSheet('#rideSheet');
  }
  function placeOptions(sel, current) {
    const sorted = [...places].sort((a, b) => a.name.localeCompare(b.name, 'de'));
    sel.innerHTML = '<option value="">– unbekannt –</option>' + sorted.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    sel.value = P(current) ? current : '';
  }
  function renderRideSheet() {
    const r = rides.find(x => x.id === rideId);
    if (!r) return closeSheets();
    $('#rsTitle').textContent = fmtDur(r.end - r.start);
    $('#rsSub').textContent = `${fmtDate(r.start)}, ${fmtClock(r.start)} – ${fmtClock(r.end)}`;

    // quick picks: the routes you drive most
    const chips = $('#rsRoutes');
    chips.textContent = '';
    const known = routeGroups().filter(g => g.k !== '?').slice(0, 3);
    for (const g of known) {
      const [a, b] = routeEnds(g.k);
      for (const [f, t] of a === b ? [[a, b]] : [[a, b], [b, a]]) {   // a Strecke in both directions
        const c = document.createElement('button');
        c.className = 'chip' + (r.from === f && r.to === t ? ' on' : '');
        c.textContent = routeName(f, t);
        c.addEventListener('click', () => { r.from = f; r.to = t; persist(); render(); renderRideSheet(); });
        chips.appendChild(c);
      }
    }
    if (P(r.from) && P(r.to) && r.from !== r.to) {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = '⇄ Richtung tauschen';
      c.addEventListener('click', () => { [r.from, r.to] = [r.to, r.from]; persist(); render(); renderRideSheet(); });
      chips.appendChild(c);
    }
    chips.hidden = !chips.children.length;
    placeOptions($('#rsFrom'), r.from);
    placeOptions($('#rsTo'), r.to);

    // Varianten
    const rel = rideVariants(r);
    const vs = rideAllVars ? variants : rel;
    const box = $('#rsVars');
    box.textContent = '';
    for (const v of vs) {
      const q = document.createElement('div');
      q.className = 'vq'; q.textContent = `Über ${v.name}?`;
      const seg = document.createElement('div');
      seg.className = 'seg';
      [[true, `Über ${v.name}`], [false, noTag(v)]].forEach(([val, label]) => {
        const b = document.createElement('button');
        b.className = 'plate ' + (val ? 'yes' : 'no') + (r.a[v.id] === val ? ' on' : '');
        b.textContent = label;
        b.addEventListener('click', () => {
          if (r.a[v.id] === val) delete r.a[v.id]; else r.a[v.id] = val;   // tap again to clear
          persist(); render(); renderRideSheet();
        });
        seg.appendChild(b);
      });
      box.append(q, seg);
    }
    $('#rsVarsL').hidden = !vs.length && !variants.length;
    if (!vs.length) box.innerHTML = '<div class="note">Für diese Strecke gibt es keine Variante.</div>';
    $('#rsAllVars').hidden = rideAllVars || rel.length === variants.length;
  }
  $('#rsFrom').addEventListener('change', e => { const r = rides.find(x => x.id === rideId); if (!r) return; r.from = e.target.value || null; persist(); render(); renderRideSheet(); });
  $('#rsTo').addEventListener('change', e => { const r = rides.find(x => x.id === rideId); if (!r) return; r.to = e.target.value || null; persist(); render(); renderRideSheet(); });
  $('#rsAllVars').addEventListener('click', () => { rideAllVars = true; renderRideSheet(); });
  $('#rsDel').addEventListener('click', () => {
    if (!confirm('Fahrt wirklich löschen?')) return;
    rides = rides.filter(x => x.id !== rideId); persist(); closeSheets(); render();
  });

  // place sheet
  let placeId = null;
  function openPlaceSheet(id) {
    if (!P(id)) return;
    placeId = id;
    renderPlaceSheet();
    openSheet('#placeSheet');
  }
  function renderPlaceSheet() {
    const p = P(placeId);
    if (!p) return closeSheets();
    const n = rides.filter(r => r.from === p.id || r.to === p.id).length;
    $('#psInfo').textContent = n ? `${plural(n, 'Fahrt startet oder endet', 'Fahrten starten oder enden')} hier` : 'Noch keine Fahrten hier';
    $('#psName').value = p.name;
    const rs = [...new Set([...RADII, p.r])].sort((a, b) => a - b);
    $('#psR').innerHTML = rs.map(r => `<option value="${r}">${r < 1000 ? r + ' m' : (r / 1000).toLocaleString('de-DE') + ' km'}</option>`).join('');
    $('#psR').value = String(p.r);
    const others = places.filter(q => q.id !== p.id).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    $('#psMerge').innerHTML = '<option value="">– Ort wählen –</option>' + others.map(q => `<option value="${esc(q.id)}">${esc(q.name)}</option>`).join('');
    $('#psMerge').disabled = !others.length;
  }
  $('#psName').addEventListener('input', e => {
    const p = P(placeId), n = e.target.value.trim();
    if (!p || !n) return;
    p.name = n; delete p.unnamed; persist(); render(); drawMap();
  });
  $('#psR').addEventListener('change', e => { const p = P(placeId); if (!p) return; p.r = +e.target.value; persist(); drawMap(); });
  $('#psMerge').addEventListener('change', e => {
    const src = P(placeId), dst = P(e.target.value);
    if (!src || !dst) return;
    if (!confirm(`„${src.name}“ mit „${dst.name}“ zusammenführen? Alle Fahrten von und nach „${src.name}“ gehören dann zu „${dst.name}“.`)) { e.target.value = ''; return; }
    replacePlace(src.id, dst.id);
    persist(); closeSheets(); render(); drawMap();
    toast(`Zusammengeführt mit ${dst.name}`);
  });
  $('#psDel').addEventListener('click', () => {
    const p = P(placeId);
    if (!p) return;
    const n = rides.filter(r => r.from === p.id || r.to === p.id).length;
    if (!confirm(`„${p.name}“ löschen?` + (n ? ` ${plural(n, 'Fahrt verliert', 'Fahrten verlieren')} dadurch ihre Strecke.` : ''))) return;
    replacePlace(p.id, null);
    persist(); closeSheets(); render(); drawMap();
  });
  $('#psMap').addEventListener('click', () => { const p = P(placeId); closeSheets(); if (p) openMap(p); });
  function replacePlace(src, dst) {
    for (const r of rides) { if (r.from === src) r.from = dst; if (r.to === src) r.to = dst; }
    for (const v of variants) v.onlyFrom = [...new Set(v.onlyFrom.map(x => (x === src ? dst : x)).filter(Boolean))];
    if (active && active.from === src) active.from = dst || (active.sp ? 'new' : 'none');
    places = places.filter(p => p.id !== src);
  }

  // variant sheet
  let varId = null;
  function openVarSheet(id) {
    if (!V(id)) return;
    varId = id;
    renderVarSheet();
    openSheet('#varSheet');
  }
  function renderVarSheet() {
    const v = V(varId);
    if (!v) return closeSheets();
    $('#vsTitle').textContent = `Über ${v.name}?`;
    if (document.activeElement !== $('#vsName')) $('#vsName').value = v.name;
    if (document.activeElement !== $('#vsNo')) $('#vsNo').value = v.no;
    $('#vsNo').placeholder = `ohne ${v.name}`;

    const chips = $('#vsFrom');
    chips.textContent = '';
    const mk = (label, on, fn) => { const c = document.createElement('button'); c.className = 'chip' + (on ? ' on' : ''); c.textContent = label; c.addEventListener('click', fn); chips.appendChild(c); };
    mk('Überall', !v.onlyFrom.length, () => { v.onlyFrom = []; persist(); render(); renderVarSheet(); });
    for (const p of [...places].sort((a, b) => a.name.localeCompare(b.name, 'de'))) {
      mk(p.name, v.onlyFrom.includes(p.id), () => {
        v.onlyFrom = v.onlyFrom.includes(p.id) ? v.onlyFrom.filter(x => x !== p.id) : [...v.onlyFrom, p.id];
        persist(); render(); renderVarSheet();
      });
    }

    const box = $('#vsAsk');
    box.textContent = '';
    v.ask.forEach((a, i) => {
      const row = document.createElement('div');
      row.className = 'askrow';
      const rs = [...new Set([...RADII, a.r])].sort((x, y) => x - y);
      row.innerHTML = `<b></b><select aria-label="Umkreis">${rs.map(r => `<option value="${r}">${r < 1000 ? r + ' m' : (r / 1000).toLocaleString('de-DE') + ' km'}</option>`).join('')}</select>
        <button class="x" aria-label="Abfragepunkt entfernen">${ICON_X}</button>`;
      row.querySelector('b').textContent = a.name;
      const sel = row.querySelector('select');
      sel.value = String(a.r);
      sel.addEventListener('change', () => { a.r = +sel.value; persist(); drawMap(); });
      row.querySelector('.x').addEventListener('click', () => { v.ask.splice(i, 1); persist(); render(); drawMap(); renderVarSheet(); });
      box.appendChild(row);
    });
    $('#vsNote').textContent = v.ask.length
      ? 'Sobald du in den Umkreis eines Abfragepunkts kommst, fragt die App „Über ' + v.name + '?“. Kommst du an keinem vorbei, fragt sie beim Beenden der Fahrt.'
      : 'Ohne Abfragepunkt fragt die App nach 7 Minuten Fahrt. Setze einen Punkt kurz vor der Abzweigung – so wie Laupheim für Risstissen –, dann fragt sie genau dort.';
  }
  $('#vsName').addEventListener('input', e => {
    const v = V(varId), n = e.target.value.trim();
    if (!v || !n) return;
    v.name = n; persist(); render(); drawMap();
    $('#vsTitle').textContent = `Über ${n}?`; $('#vsNo').placeholder = `ohne ${n}`;
  });
  $('#vsNo').addEventListener('input', e => { const v = V(varId); if (!v) return; v.no = e.target.value.trim(); persist(); render(); });
  [$('#vsName'), $('#vsNo'), $('#psName')].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); }));
  $('#vsAddAsk').addEventListener('click', () => {
    const v = V(varId);
    if (!v) return;
    closeSheets();
    openMap(null, () => setPick({ kind: 'ask', vid: v.id }));
  });
  $('#vsMap').addEventListener('click', () => { const v = V(varId); closeSheets(); if (v) openMap(v); });
  $('#vsDel').addEventListener('click', () => {
    const v = V(varId);
    if (!v) return;
    const n = rides.filter(r => r.a[v.id] !== undefined).length;
    if (!confirm(`Variante „${v.name}“ löschen?` + (n ? ` Die Antworten von ${plural(n, 'Fahrt', 'Fahrten')} gehen verloren.` : ''))) return;
    variants = variants.filter(x => x.id !== v.id);
    for (const r of rides) delete r.a[v.id];
    if (active) delete active.a[v.id];
    persist(); closeSheets(); render(); drawMap();
  });

  // ---------- map ----------
  let map = null, mapLayer = null, pick = null, meMarker = null, tempMarker = null;
  function openMap(focus, then) {
    $('#mapPage').classList.add('open');
    if (!window.L) { toast('Karte konnte nicht geladen werden'); return; }
    const first = !map;
    if (first) initMap();
    requestAnimationFrame(() => {
      map.invalidateSize();
      drawMap();
      if (focus) map.setView([focus.lat, focus.lon], Math.max(map.getZoom(), 13));
      else if (first) fitAll();
      if (then) then();
    });
  }
  function closeMap() {
    setPick(null); hideBanner();
    $('#mapRes').hidden = true;
    $('#mapPage').classList.remove('open');
  }
  function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
    map.setView([48.3, 9.85], 10);
    map.on('click', e => {
      $('#mapRes').hidden = true;
      if (pick) createAt(pick, e.latlng.lat, e.latlng.lng);
    });
  }
  function fitAll() {
    const pts = [...places.map(p => [p.lat, p.lon]), ...variants.flatMap(v => [[v.lat, v.lon], ...v.ask.map(a => [a.lat, a.lon])])];
    if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 13 });
  }
  function pin(latlng, html, onMove, onTap) {
    const m = L.marker(latlng, { icon: L.divIcon({ className: 'mk-w', html, iconSize: null }), draggable: true, autoPan: true }).addTo(mapLayer);
    m.on('dragend', () => { const ll = m.getLatLng(); onMove(+ll.lat.toFixed(5), +ll.lng.toFixed(5)); persist(); drawMap(); render(); });
    m.on('click', () => { if (!pick) onTap(); });
    return m;
  }
  function drawMap() {
    if (!map) return;
    mapLayer.clearLayers();
    for (const p of places) {
      L.circle([p.lat, p.lon], { radius: p.r, color: '#f2f1ec', weight: 1.5, opacity: .7, fillOpacity: .06, dashArray: '4 6', interactive: false }).addTo(mapLayer);
      pin([p.lat, p.lon], `<div class="mk mk-p">${esc(p.name)}</div>`, (lat, lon) => { p.lat = lat; p.lon = lon; }, () => openPlaceSheet(p.id));
    }
    for (const v of variants) {
      v.ask.forEach(a => {
        L.polyline([[a.lat, a.lon], [v.lat, v.lon]], { color: '#79a8ee', weight: 2, dashArray: '2 7', interactive: false }).addTo(mapLayer);
        L.circle([a.lat, a.lon], { radius: a.r, color: '#79a8ee', weight: 1.5, fillOpacity: .08, interactive: false }).addTo(mapLayer);
        pin([a.lat, a.lon], '<div class="mk mk-a">?</div>', (lat, lon) => { a.lat = lat; a.lon = lon; }, () => openVarSheet(v.id));
      });
      pin([v.lat, v.lon], `<div class="mk mk-v">${esc(v.name)}</div>`, (lat, lon) => { v.lat = lat; v.lon = lon; }, () => openVarSheet(v.id));
    }
    if (meMarker) meMarker.addTo(mapLayer);
  }

  // banner at the bottom of the map: instructions while picking, actions after a search
  function showBanner(text, buttons) {
    $('#mapBannerT').textContent = text;
    const b = $('#mapBannerB');
    b.textContent = '';
    for (const { label, primary, fn } of buttons) {
      const x = document.createElement('button');
      x.textContent = label;
      if (primary) x.className = 'primary';
      x.addEventListener('click', fn);
      b.appendChild(x);
    }
    $('#mapBanner').hidden = false;
  }
  function hideBanner() {
    $('#mapBanner').hidden = true;
    if (tempMarker) { tempMarker.remove(); tempMarker = null; }
  }
  const PICK_TEXT = {
    variant: 'Tippe auf die Karte, wo die Variante langführt – oder suche oben den Ort, z. B. Ehingen.',
    place: 'Tippe auf die Karte, wo der Ort liegt – oder suche ihn oben.',
  };
  function setPick(p) {
    pick = p;
    $('#mapPage').classList.toggle('picking', !!p);
    if (!p) { hideBanner(); return; }
    if (tempMarker) { tempMarker.remove(); tempMarker = null; }
    const text = p.kind === 'ask' ? `Tippe dort auf die Karte, wo die App „Über ${V(p.vid) ? V(p.vid).name : ''}?“ fragen soll – am besten kurz vor der Abzweigung.` : PICK_TEXT[p.kind];
    showBanner(text, [{ label: 'Abbrechen', fn: () => { const back = p.kind === 'ask' ? p.vid : null; setPick(null); if (back) openVarSheet(back); } }]);
  }
  async function createAt(p, lat, lon, name) {
    setPick(null);
    lat = +lat.toFixed(5); lon = +lon.toFixed(5);
    showBanner('Ort wird bestimmt …', []);
    name = name || await revName(lat, lon, p.kind === 'place' ? 'local' : 'town');
    hideBanner();
    if (p.kind === 'place') {
      const pl = { id: uid(), name: name || newPlaceName(), lat, lon, r: NEW_PLACE_R };
      places.push(pl);
      persist(); drawMap(); render(); openPlaceSheet(pl.id);
    } else if (p.kind === 'variant') {
      const v = { id: uid(), name: name || 'Neue Variante', no: '', lat, lon, onlyFrom: [], ask: [] };
      variants.push(v);
      persist(); drawMap(); render(); openVarSheet(v.id);
    } else if (p.kind === 'ask') {
      const v = V(p.vid);
      if (!v) return;
      v.ask.push({ name: name || 'Abfragepunkt', lat, lon, r: ASK_R });
      persist(); drawMap(); render(); openVarSheet(v.id);
    }
  }

  $('#mapOpenTop').addEventListener('click', () => openMap());
  $('#mapOpenRow').addEventListener('click', () => openMap());
  $('#mapBack').addEventListener('click', closeMap);
  $('#addVar').addEventListener('click', () => { $('#mapRes').hidden = true; setPick({ kind: 'variant' }); });
  $('#addPlace').addEventListener('click', () => { $('#mapRes').hidden = true; setPick({ kind: 'place' }); });
  $('#mapLocate').addEventListener('click', () => {
    if (!hasGeo || !map) return;
    navigator.geolocation.getCurrentPosition(({ coords: c }) => {
      if (meMarker) meMarker.remove();
      meMarker = L.marker([c.latitude, c.longitude], { icon: L.divIcon({ className: 'mk-w', html: '<div class="mk mk-me"></div>', iconSize: null }), interactive: false }).addTo(mapLayer);
      map.setView([c.latitude, c.longitude], Math.max(map.getZoom(), 14));
    }, e => toast(e.code === 1 ? 'Standortzugriff nicht erlaubt' : 'Kein Standort'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
  $('#mapSearch').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#mapQ').value.trim();
    if (!q) return;
    $('#mapQ').blur();
    const box = $('#mapRes');
    box.hidden = false;
    box.innerHTML = '<div class="res-m">Suche …</div>';
    try {
      const params = { q, limit: 6, countrycodes: 'de,at,ch' };
      if (map) { const b = map.getBounds(); params.viewbox = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].map(n => n.toFixed(4)).join(','); }
      const res = await osm('search', params);
      box.textContent = '';
      if (!res.length) { box.innerHTML = '<div class="res-m">Nichts gefunden.</div>'; return; }
      for (const r of res) {
        const name = r.name || r.display_name.split(',')[0];
        const lat = +r.lat, lon = +r.lon;
        const b = document.createElement('button');
        b.className = 'res';
        b.innerHTML = '<b></b><span></span>';
        b.querySelector('b').textContent = name;
        b.querySelector('span').textContent = r.display_name;
        b.addEventListener('click', () => {
          box.hidden = true;
          if (!map) return;
          map.setView([lat, lon], 13);
          if (pick) return createAt(pick, lat, lon, name);
          // no mode chosen yet: offer what to do with it
          if (tempMarker) tempMarker.remove();
          tempMarker = L.marker([lat, lon], { icon: L.divIcon({ className: 'mk-w', html: `<div class="mk mk-v" style="opacity:.6">${esc(name)}</div>`, iconSize: null }), interactive: false }).addTo(map);
          showBanner(name, [
            { label: '+ Variante', primary: true, fn: () => createAt({ kind: 'variant' }, lat, lon, name) },
            { label: '+ Ort', fn: () => createAt({ kind: 'place' }, lat, lon, name) },
            { label: 'Schließen', fn: hideBanner },
          ]);
        });
        box.appendChild(b);
      }
    } catch { box.innerHTML = '<div class="res-m">Suche nicht möglich – keine Verbindung?</div>'; }
  });

  // ---------- toast ----------
  let toastTimer;
  function hideToast() { $('#toast').classList.remove('show'); }
  function toast(msg, label, action) {
    $('#toastMsg').textContent = msg;
    const b = $('#toastBtn');
    if (label) { b.textContent = label; b.hidden = false; b.onclick = () => { hideToast(); action(); }; }
    else b.hidden = true;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, label ? 7000 : 2600);
  }

  // ---------- export / backup ----------
  async function shareFile(name, text, type) {
    const file = new File([text], name, { type });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  const csvCell = s => (/[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);

  $('#csvBtn').addEventListener('click', () => {
    if (!rides.length) return toast('Noch keine Fahrten');
    const vs = variants.filter(v => rides.some(r => r.a[v.id] !== undefined));
    const rows = [['Datum', 'Start', 'Ende', 'Dauer', 'Dauer (min)', 'Von', 'Nach', ...vs.map(v => `Über ${v.name}`)]];
    for (const r of [...rides].reverse()) {
      rows.push([
        new Date(r.start).toLocaleDateString('de-DE'), fmtClock(r.start), fmtClock(r.end),
        fmtDur(r.end - r.start), ((r.end - r.start) / 60000).toFixed(1).replace('.', ','),
        P(r.from) ? P(r.from).name : '', P(r.to) ? P(r.to).name : '',
        ...vs.map(v => (r.a[v.id] === true ? 'Ja' : r.a[v.id] === false ? 'Nein' : '')),
      ]);
    }
    shareFile(`fahrzeiten-${stamp()}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\n'), 'text/csv');
  });
  $('#backupBtn').addEventListener('click', () => {
    const data = { app: 'fahrzeit', version: 3, exported: new Date().toISOString(), places, variants, rides };
    shareFile(`fahrzeit-backup-${stamp()}.json`, JSON.stringify(data, null, 2), 'application/json');
  });
  $('#restoreBtn').addEventListener('click', () => $('#fileIn').click());
  $('#fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      for (const p of (data.places || []).map(cleanPlace)) if (p && !P(p.id)) places.push(p);
      for (const v of (data.variants || []).map(cleanVariant)) if (v && !V(v.id)) variants.push(v);
      const incoming = (Array.isArray(data) ? data : data.rides || []).map(cleanRide).filter(Boolean);
      // old backups refer to the built-in places and Varianten
      const used = new Set(incoming.flatMap(r => [r.from, r.to, ...Object.keys(r.a)]));
      for (const s of SEED_PLACES) if (used.has(s.id) && !P(s.id)) places.push(clone(s));
      for (const s of SEED_VARIANTS) if (used.has(s.id) && !V(s.id)) variants.push(clone(s));
      const known = new Set(rides.map(r => r.id));
      let added = 0;
      for (const r of incoming) { if (known.has(r.id)) continue; rides.push(r); known.add(r.id); added++; }
      rides.sort((a, b) => b.start - a.start);
      persist(); render(); drawMap();
      toast(`${plural(added, 'Fahrt', 'Fahrten')} importiert`);
    } catch { toast('Datei konnte nicht gelesen werden'); }
  });

  // ---------- boot ----------
  render();
  if (active) wake();
  places.filter(p => p.unnamed).forEach(nameFromMap);   // places found while offline get their name now
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

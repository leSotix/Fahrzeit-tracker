<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahrzeit">
<meta name="theme-color" content="#191b1e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<title>Fahrzeit</title>
<style>
  /* Barlow (SIL OFL 1.1) — a grotesk modelled on road signage; self-hosted so the app works offline. */
  @font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
  @font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
  @font-face{font-family:Barlow;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}

  :root{
    /* road surface */
    --asphalt:#191b1e; --asphalt-2:#212428; --asphalt-3:#2a2e33; --line:#353a41;
    --paint:#f2f1ec; --muted:#959ba3; --ink:#15150f;
    /* signage */
    --sign-yellow:#f6c400;              /* Ortstafel  → über Risstissen */
    --sign-blue:#1f5cb3; --blue-hi:#79a8ee; /* Wegweiser → direkt */
    --steel:#56606c;                    /* Ulm-Einfahrt → Donautal (B 10 uses white paint) */
    /* signals */
    --go:#1f9d50; --go-edge:#157a3c;
    --stop:#d6261e; --stop-edge:#a51b15;

    --display:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
    --text:Barlow,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--asphalt);color:var(--paint)}
  body{
    font-family:var(--text);font-weight:500;font-size:16px;line-height:1.4;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior-y:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--sign-yellow);outline-offset:3px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .num{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums}

  /* ---------- Sign plates (shared) ----------
     A plate is a coloured panel with an inset border line, like a German road sign. */
  .plate{position:relative;border-radius:14px}
  .plate::before{content:"";position:absolute;inset:6px;border:3px solid currentColor;border-radius:9px;pointer-events:none}
  .plate.r{background:var(--sign-yellow);color:var(--ink)}
  .plate.d{background:var(--sign-blue);color:#fff}
  .plate.w{background:var(--paint);color:var(--ink)}
  .plate.s{background:var(--steel);color:#fff}

  .tag{
    display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:5px;
    font-family:var(--display);font-weight:700;font-size:15px;line-height:1;letter-spacing:.2px;white-space:nowrap;
  }
  .tag.r{background:var(--sign-yellow);color:var(--ink);box-shadow:inset 0 0 0 2px var(--sign-yellow),inset 0 0 0 3.5px var(--ink)}
  .tag.d{background:var(--sign-blue);color:#fff;box-shadow:inset 0 0 0 2px var(--sign-blue),inset 0 0 0 3.5px #fff}
  .tag.w{background:var(--paint);color:var(--ink);box-shadow:inset 0 0 0 2px var(--paint),inset 0 0 0 3.5px var(--ink)}
  .tag.s{background:var(--steel);color:#fff;box-shadow:inset 0 0 0 2px var(--steel),inset 0 0 0 3.5px #fff}

  /* ---------- Hero (driving screen) ---------- */
  .hero{
    min-height:100svh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 0 18px;gap:16px;
  }
  .top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:24px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .live{display:none;align-items:center;gap:8px;font-size:16px;font-weight:600;color:#ff8a84}
  .live i{width:10px;height:10px;border-radius:50%;background:var(--stop);animation:blink 1.4s infinite}
  .running .live{display:flex}
  @keyframes blink{50%{opacity:.25}}

  .clock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:170px}
  .timer{
    font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums lining-nums;
    font-size:clamp(104px,33vw,168px);line-height:.9;letter-spacing:-1px;color:var(--paint);
  }
  .timer.long{font-size:clamp(80px,24vw,128px)}
  .idle .timer{color:#5c626a}
  .status{margin-top:12px;font-size:18px;color:var(--muted);min-height:25px}
  .geoline{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);text-wrap:balance}
  .geoline svg{width:16px;height:16px;flex:none}

  /* route signs — tap to choose / change */
  .routes{display:grid;grid-template-columns:1fr;gap:10px}
  .routes.two{grid-template-columns:1fr 1fr}
  .route{
    width:100%;min-height:92px;padding:14px 22px;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;
    color:var(--muted);visibility:hidden;
  }
  .running .route{visibility:visible}
  .route::before{border-style:dashed;border-width:2px;border-color:var(--line)}
  .route.set::before{border-style:solid;border-width:3px;border-color:currentColor}
  .route:active{transform:scale(.985)}
  .route .k{font-size:15px;font-weight:600;opacity:.85}
  .route .n{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05}
  .route:not(.set) .n{color:var(--paint)}
  .routes.two .route{padding:14px 10px}
  .routes.two .route .n{font-size:30px}
  .routes.two .route .k{font-size:14px}

  /* start / stop — a wide slab in the thumb zone */
  .main{
    width:100%;height:clamp(150px,30svh,250px);border-radius:26px;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:16px;
    background:var(--go);box-shadow:inset 0 -7px 0 var(--go-edge);
    transition:transform .1s ease, background-color .25s ease, box-shadow .25s ease;
  }
  .main:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 var(--go-edge)}
  .running .main{background:var(--stop);box-shadow:inset 0 -7px 0 var(--stop-edge)}
  .running .main:active{box-shadow:inset 0 -4px 0 var(--stop-edge)}
  .main svg{width:clamp(52px,15vw,68px);height:clamp(52px,15vw,68px);flex:none}
  .main .lbl{font-family:var(--display);font-weight:700;font-size:clamp(60px,18vw,84px);line-height:1}
  .main .i-stop{display:none}
  .running .main .i-play{display:none}
  .running .main .i-stop{display:block}

  .sub{display:flex;justify-content:center;min-height:48px}
  .discard{display:none;min-height:48px;padding:0 18px;font-size:16px;font-weight:600;color:var(--muted)}
  .running .discard{display:block}
  .hint{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:16px;font-weight:600;min-height:48px;padding:0 14px}
  .hint svg{width:18px;height:18px}
  .running .hint{display:none}

  /* ---------- Stats + History ---------- */
  #history{padding-bottom:36px}
  h3{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:28px 2px 12px}

  .stats{display:grid;grid-template-columns:1fr 1fr;background:var(--asphalt-2);border-radius:20px}
  .stat{padding:16px 16px 18px}
  .stat + .stat{border-left:1px solid var(--line)}
  .avg{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums lining-nums;font-size:46px;line-height:1;margin:14px 0 4px}
  .avg small{font-family:var(--text);font-size:18px;font-weight:600;color:var(--muted);margin-right:4px;vertical-align:4px}
  .meta{font-size:15px;color:var(--muted)}
  .meta dl{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 8px;margin:10px 0 0}
  .meta dt,.meta dd{margin:0}
  .meta dd{color:var(--paint);font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums lining-nums;text-align:right}
  .delta{margin:10px 2px 0;font-size:16px;color:var(--muted);text-wrap:pretty}
  .delta b{white-space:nowrap}
  .delta b{color:var(--paint);font-weight:700}

  .list{background:var(--asphalt-2);border-radius:20px;overflow:hidden}
  .ride{
    position:relative;width:100%;text-align:left;min-height:76px;
    display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:14px;
    padding:12px 14px 12px 22px;
  }
  .ride + .ride{border-top:1px solid var(--line)}
  .ride::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:5px;border-radius:3px}
  .ride.r::before{background:var(--sign-yellow)}
  .ride.d::before{background:var(--sign-blue)}
  .ride:active{background:var(--asphalt-3)}
  .rdate{font-size:17px;font-weight:600}
  .rtime{font-size:15px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .rdir{font-size:14px;color:var(--muted);margin-top:1px}
  .rright{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .rdur{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums lining-nums}
  .chev{width:18px;height:18px;color:#5c626a}
  .empty{color:var(--muted);text-align:center;padding:30px 16px}

  #viaStats{margin-top:16px}

  /* location setting */
  .setting{
    width:100%;margin-top:24px;padding:16px 16px 16px 18px;border-radius:20px;background:var(--asphalt-2);
    display:flex;align-items:center;gap:14px;text-align:left;
  }
  .setting:active{background:var(--asphalt-3)}
  .set-t{font-size:17px;font-weight:600}
  .set-s{font-size:15px;color:var(--muted);margin-top:3px;text-wrap:pretty}
  .switch{flex:none;position:relative;width:56px;height:34px;border-radius:17px;background:var(--asphalt-3);box-shadow:inset 0 0 0 2px var(--line);transition:background-color .2s ease}
  .switch i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:transform .2s ease, background-color .2s ease}
  .setting[aria-checked="true"] .switch{background:var(--go);box-shadow:none}
  .setting[aria-checked="true"] .switch i{transform:translateX(22px);background:#fff}
  .setting + .tools{margin-top:12px}

  .tools{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;background:var(--asphalt-2);border-radius:20px;overflow:hidden}
  .tool{min-height:72px;padding:10px 6px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .tool + .tool{border-left:1px solid var(--line)}
  .tool svg{width:22px;height:22px;color:var(--paint)}
  .tool:active{background:var(--asphalt-3)}

  /* ---------- Route prompt overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(25,27,30,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .overlay.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .ov{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .ov-k{text-align:center;color:var(--muted);font-size:17px;font-weight:600;margin-top:4px}
  .ov h2{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,60px);line-height:1;margin:0 0 6px}
  .big{
    flex:1;min-height:150px;border-radius:26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .big::before{inset:10px;border-width:4px;border-radius:17px}
  .big:active{transform:scale(.98)}
  .big .bk{font-family:var(--display);font-weight:700;font-size:clamp(64px,20vw,96px);line-height:1}
  .big .bs{font-size:19px;font-weight:600;opacity:.85}
  .ov-later{min-height:60px;border-radius:18px;background:var(--asphalt-2);font-size:19px;font-weight:600;color:var(--paint)}

  /* ---------- Sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
  .sheet.open{display:flex}
  .sheet-c{
    width:100%;max-width:560px;margin:0 auto;background:var(--asphalt-2);border-radius:26px 26px 0 0;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px;
    animation:up .22s ease;
  }
  .sheet-c::before{content:"";align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet-t{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;text-align:center;font-variant-numeric:tabular-nums lining-nums}
  .sheet-s{font-size:16px;color:var(--muted);text-align:center;margin-bottom:6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg button{min-height:72px;padding:0 12px;border-radius:14px;font-family:var(--display);font-weight:700;font-size:21px;color:var(--muted);background:var(--asphalt-3)}
  .seg button::before{border-width:2px;border-style:dashed;border-color:var(--line)}
  .seg button.on[data-v="1"]{background:var(--sign-yellow);color:var(--ink)}
  .seg button.on[data-v="0"]{background:var(--sign-blue);color:#fff}
  .seg button.on[data-v="b10"]{background:var(--paint);color:var(--ink)}
  .seg button.on[data-v="donautal"]{background:var(--steel);color:#fff}
  .seg button.on::before{border-style:solid;border-width:3px;border-color:currentColor}
  .btn{min-height:56px;border-radius:16px;font-size:17px;font-weight:600;background:var(--asphalt-3)}
  .btn.danger{color:#ff8a84}
  .btn.primary{background:var(--paint);color:var(--ink);font-weight:700}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:60;
    transform:translate(-50%,calc(100% + 40px + env(safe-area-inset-bottom)));visibility:hidden;
    transition:transform .28s ease, visibility 0s linear .28s;
    width:calc(100% - 32px);max-width:528px;background:var(--asphalt-3);border-radius:18px;
    padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:17px;font-weight:600;box-shadow:0 18px 50px -10px rgba(0,0,0,.7);
  }
  .toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .28s ease}
  .toast button{min-height:48px;padding:0 16px;border-radius:12px;background:var(--paint);color:var(--ink);font-weight:700}

  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body class="idle">

<div class="wrap">
  <section class="hero">
    <div class="top">
      <div class="brand"><img src="icon-180.png" alt="">Fahrzeit</div>
      <div class="live"><i></i>Fahrt läuft</div>
    </div>

    <div class="clock">
      <div class="timer" id="timer">00:00</div>
      <div class="status" id="status">Bereit für die Fahrt</div>
      <div class="geoline" id="geoLine" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="geoText"></span>
      </div>
    </div>

    <div class="routes" id="routes">
      <button class="route plate" id="routeBtn" aria-label="Route wählen"></button>
      <button class="route plate" id="viaBtn" aria-label="Einfahrt Ulm wählen" hidden></button>
    </div>

    <button class="main" id="mainBtn" aria-label="Fahrt starten oder beenden">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="2.5"/></svg>
      <span class="lbl" id="mainLbl">Start</span>
    </button>

    <div class="sub">
      <button class="discard" id="discardBtn">Fahrt verwerfen</button>
      <a class="hint" href="#history" onclick="document.getElementById('history').scrollIntoView({behavior:'smooth'});return false">
        Statistik &amp; Verlauf
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </div>
  </section>

  <section id="history">
    <h3>Statistik</h3>
    <div class="stats">
      <div class="stat"><span class="tag r">Risstissen</span><div class="avg" id="avgR">–</div><div class="meta" id="metaR"></div></div>
      <div class="stat"><span class="tag d">Direkt</span><div class="avg" id="avgD">–</div><div class="meta" id="metaD"></div></div>
    </div>
    <div class="delta" id="delta" hidden></div>
    <div id="viaStats" hidden>
      <div class="stats">
        <div class="stat"><span class="tag w">B 10</span><div class="avg" id="avgB">–</div><div class="meta" id="metaB"></div></div>
        <div class="stat"><span class="tag s">Donautal</span><div class="avg" id="avgT">–</div><div class="meta" id="metaT"></div></div>
      </div>
      <div class="delta" id="deltaV" hidden></div>
    </div>

    <h3>Verlauf</h3>
    <div class="list" id="list"></div>

    <button class="setting" id="geoBtn" role="switch" aria-checked="false">
      <div>
        <div class="set-t">Standort-Abfrage</div>
        <div class="set-s">Fragt in Laupheim (ab Ulm) bzw. in Untersulmetingen und an der Ausfahrt Ulm-Donautal (ab Unterstadion) statt nach 7 Minuten. Prüft den Standort nur alle paar Minuten, kurz vor einem Abfragepunkt öfter.</div>
      </div>
      <span class="switch" aria-hidden="true"><i></i></span>
    </button>

    <div class="tools">
      <button class="tool" id="csvBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        CSV Export
      </button>
      <button class="tool" id="backupBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Backup sichern
      </button>
      <button class="tool" id="restoreBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>
        Backup laden
      </button>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </section>
</div>

<!-- Route prompt -->
<div class="overlay" id="prompt" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="ov">
    <div class="ov-k" id="pKick">7 Minuten unterwegs</div>
    <h2 id="pTitle">Über Risstissen?</h2>
    <button class="big plate r" id="pA"><span class="bk">Ja</span><span class="bs">über Risstissen</span></button>
    <button class="big plate d" id="pB"><span class="bk">Nein</span><span class="bs">direkt</span></button>
    <button class="ov-later" id="pLater">Später</button>
  </div>
</div>

<!-- Ride edit sheet -->
<div class="sheet" id="sheet">
  <div class="sheet-c" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="sheet-t" id="sTitle"></div>
    <div class="sheet-s" id="sSub"></div>
    <div class="seg" id="sSeg">
      <button class="plate" data-v="1">Über Risstissen</button>
      <button class="plate" data-v="0">Ohne Risstissen</button>
    </div>
    <div class="seg" id="sSegV" hidden>
      <button class="plate" data-v="b10">Über B 10</button>
      <button class="plate" data-v="donautal">Über Donautal</button>
    </div>
    <button class="btn danger" id="sDel">Fahrt löschen</button>
    <button class="btn primary" id="sClose">Fertig</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script>
(() => {
  'use strict';
  const K_RIDES = 'fahrzeit.rides.v1';
  const K_ACTIVE = 'fahrzeit.active.v1';
  const K_GEO = 'fahrzeit.geo.v1';
  const PROMPT_AFTER_MS = 7 * 60 * 1000;

  // ---------- places (coordinates from OpenStreetMap; r = radius in metres) ----------
  // Where a ride starts decides the direction and which checkpoints apply.
  const ORIGINS = {
    ulm:          { name: 'Ulm',          lat: 48.3985, lon: 9.9912, r: 12000 },
    unterstadion: { name: 'Unterstadion', lat: 48.2036, lon: 9.6884, r: 6000 },
  };
  const DEST = { ulm: 'unterstadion', unterstadion: 'ulm' };
  // q: which question is asked there ('route' = über Risstissen?, 'via' = B 10 oder Donautal?)
  const CHECKPOINTS = {
    ulm: [
      { id: 'laupheim', q: 'route', at: 'in Laupheim', kick: 'In Laupheim', lat: 48.2301, lon: 9.8837, r: 4000 },
    ],
    unterstadion: [
      { id: 'untersulmetingen', q: 'route', at: 'in Untersulmetingen', kick: 'In Untersulmetingen', lat: 48.2307, lon: 9.8263, r: 1500 },
      { id: 'donautal', q: 'via', at: 'an der Ausfahrt Ulm-Donautal', kick: 'B 30 · Ausfahrt Ulm-Donautal', lat: 48.3607, lon: 9.9683, r: 1000 },
    ],
  };
  // Sampling: sparse while far away, denser when a checkpoint could be reached soon.
  const MAX_SPEED = 36;                 // m/s ≈ 130 km/h — the fastest we could approach a checkpoint
  const GEO_MIN_GAP = 15000, GEO_MAX_GAP = 3 * 60000, GEO_RETRY = 30000;

  const $ = s => document.querySelector(s);
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const isOrigin = v => v === 'ulm' || v === 'unterstadion';
  const isVia = v => v === 'b10' || v === 'donautal';
  const dirName = from => `${ORIGINS[from].name} → ${ORIGINS[DEST[from]].name}`;

  /** rides: [{id, start, end, risstissen: boolean, from?: 'ulm'|'unterstadion', via?: 'b10'|'donautal'}] newest first */
  let rides = load(K_RIDES, []);
  /** active: {start, route: null|true|false, snoozed: bool,
   *           from: null (not yet located)|'ulm'|'unterstadion'|'other'|'none', via: null|'b10'|'donautal', hit: {checkpointId: true}} */
  let active = load(K_ACTIVE, null);
  if (active) { active.from ??= null; active.via ??= null; active.hit ??= {}; }
  let geoOn = load(K_GEO, false) === true;
  let promptMode = null;     // 'auto' | 'manual' | 'stop'
  let promptQ = 'route';     // 'route' | 'via'
  let promptOpenedAt = 0;
  let autoQueue = [];        // location prompts waiting while another prompt is open
  let stopQueue = null;      // questions left to ask before saving, while stopping
  let stopAt = null;
  let lastTap = 0;

  function persist() {
    try {
      localStorage.setItem(K_RIDES, JSON.stringify(rides));
      if (active) localStorage.setItem(K_ACTIVE, JSON.stringify(active));
      else localStorage.removeItem(K_ACTIVE);
    } catch { toast('Speichern fehlgeschlagen!'); }
  }
  function saveGeo() { try { localStorage.setItem(K_GEO, JSON.stringify(geoOn)); } catch {} }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

  // ---------- formatting ----------
  const p2 = n => String(n).padStart(2, '0');
  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h ? `${h}:${p2(m)}:${p2(ss)}` : `${p2(m)}:${p2(ss)}`;
  }
  const fmtClock = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  // ---------- audio chime (unlocked on Start tap) ----------
  let actx = null;
  function unlockAudio() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'transient';
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      g.gain.value = 0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.02);
    } catch {}
  }
  function chime() {
    if (!actx) return;
    try {
      actx.resume();
      const t = actx.currentTime;
      [[784, 0], [1047, 0.2], [1319, 0.4]].forEach(([f, d]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.5, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.45);
        o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + 0.5);
      });
    } catch {}
  }

  // ---------- keep screen awake while riding ----------
  let wakeLock = null;
  async function wake() {
    try {
      if (!wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }
  function unwake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

  // ---------- location ----------
  // Only foreground sampling is possible for a web app: while the screen is on (the wake lock keeps it on
  // during a ride). If the phone was locked, the first fix after unlocking catches up via the "passed" check.
  function dist(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  const hasGeo = 'geolocation' in navigator;
  const geoGuides = () => geoOn && !!active && isOrigin(active.from);
  function pendingChecks() {
    if (!geoGuides()) return [];
    return CHECKPOINTS[active.from].filter(c =>
      !active.hit[c.id] && (c.q === 'route' ? active.route === null : active.via === null));
  }
  const geoWanted = () => hasGeo && geoOn && !!active && !stopQueue && (active.from === null || pendingChecks().length > 0);

  let geoTimer = null, geoReq = 0, geoBusyUntil = 0;
  function geoSync() {
    if (!geoWanted()) { clearTimeout(geoTimer); geoTimer = null; return; }
    if (!geoTimer && Date.now() >= geoBusyUntil) geoSample();
  }
  function geoLater(ms) { clearTimeout(geoTimer); geoTimer = setTimeout(geoSample, ms); }
  function geoSample() {
    clearTimeout(geoTimer); geoTimer = null;
    if (!geoWanted() || document.visibilityState !== 'visible') return; // resumes on visibilitychange
    if (Date.now() < geoBusyUntil) return geoLater(geoBusyUntil - Date.now() + 100);
    const id = ++geoReq, ride = active.start;
    geoBusyUntil = Date.now() + 30000;   // a request that never answers must not block sampling forever
    const done = fn => arg => {
      if (id !== geoReq) return;
      geoBusyUntil = 0;
      if (active && active.start === ride) fn(arg); else geoSync();
    };
    navigator.geolocation.getCurrentPosition(done(onFix), done(onGeoError),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  }
  function onFix({ coords: c }) {
    const here = { lat: c.latitude, lon: c.longitude };
    const slack = Math.min(c.accuracy || 0, 300);
    if (active.from === null) {
      active.from = Object.keys(ORIGINS).find(k => dist(here, ORIGINS[k]) <= ORIGINS[k].r) || 'other';
    }
    if (geoGuides()) {
      const dest = ORIGINS[DEST[active.from]], toDest = dist(here, dest);
      for (const cp of pendingChecks()) {
        const reached = dist(here, cp) - slack <= cp.r;
        const passed = toDest < dist(cp, dest) - cp.r;   // already beyond it, e.g. the screen was off
        if (!reached && !passed) continue;
        active.hit[cp.id] = true;
        ask(cp.q, reached ? cp.kick : null);
      }
    }
    persist();
    const pend = pendingChecks();
    if (geoWanted() && pend.length) {
      const edge = Math.min(...pend.map(cp => dist(here, cp) - cp.r));
      const gap = Math.min(GEO_MAX_GAP, Math.max(GEO_MIN_GAP, edge / MAX_SPEED * 1000 * 0.8));
      geoLater(gap);
    }
    render();
  }
  function onGeoError(e) {
    if (e && e.code === 1) {   // permission denied → fall back to the 7-minute prompt
      geoOn = false; saveGeo(); render();
      return toast('Standort nicht erlaubt – Abfrage nach 7 Minuten');
    }
    geoLater(GEO_RETRY);
  }

  $('#geoBtn').addEventListener('click', () => {
    if (geoOn) { geoOn = false; saveGeo(); render(); return toast('Standort-Abfrage aus'); }
    if (!hasGeo) return toast('Standort wird nicht unterstützt');
    // asks for permission now, from a tap, rather than mid-ride
    navigator.geolocation.getCurrentPosition(
      () => { geoOn = true; saveGeo(); render(); toast('Standort-Abfrage an'); },
      e => {
        if (e.code === 1) return toast('Standortzugriff nicht erlaubt');
        geoOn = true; saveGeo(); render(); toast('Standort-Abfrage an · noch kein Signal');
      },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
  });

  // ---------- ride control ----------
  function startRide() {
    unlockAudio();
    active = { start: Date.now(), route: null, snoozed: false, from: null, via: null, hit: {} };
    autoQueue = [];
    persist(); wake(); render();   // render → geoSync takes the first fix right away
  }
  function requestStop() {
    stopAt = Date.now();
    autoQueue = [];
    stopQueue = [];
    if (active.route === null) stopQueue.push('route');
    if (active.from === 'unterstadion' && active.via === null) stopQueue.push('via');
    nextStopQuestion();
  }
  function nextStopQuestion() {
    const q = stopQueue && stopQueue.shift();
    if (q) openPrompt('stop', q);
    else { stopQueue = null; finishRide(); }
  }
  function finishRide() {
    const ride = { id: uid(), start: active.start, end: stopAt || Date.now(), risstissen: !!active.route };
    if (isOrigin(active.from)) ride.from = active.from;
    if (isVia(active.via)) ride.via = active.via;
    const prev = { ...active, hit: { ...active.hit } };
    rides.unshift(ride);
    active = null; stopAt = null; stopQueue = null; autoQueue = [];
    persist(); unwake(); render();
    toast(`Gespeichert · ${fmtDur(ride.end - ride.start)}`, 'Rückgängig', () => {
      rides = rides.filter(r => r.id !== ride.id);
      active = prev; persist(); wake(); render();
    });
  }
  function discardRide() {
    if (!confirm('Diese Fahrt verwerfen? Sie wird nicht gespeichert.')) return;
    active = null; stopAt = null; stopQueue = null; autoQueue = []; persist(); unwake(); render();
  }

  $('#mainBtn').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 800) return; // guard against double taps
    lastTap = now;
    active ? requestStop() : startRide();
  });
  $('#discardBtn').addEventListener('click', discardRide);
  $('#routeBtn').addEventListener('click', () => active && openPrompt('manual', 'route'));
  $('#viaBtn').addEventListener('click', () => active && openPrompt('manual', 'via'));

  // ---------- route prompt ----------
  // a / b: [plate class, big word, small line]; answering a → true / 'b10', b → false / 'donautal'
  const QUESTIONS = {
    route: { title: 'Über Risstissen?', a: ['r', 'Ja', 'über Risstissen'], b: ['d', 'Nein', 'direkt'] },
    via:   { title: 'Wie weiter?', a: ['w', 'B 10', 'weiter auf der B 30'], b: ['s', 'Donautal', 'hier abfahren'] },
  };
  function setBig(btn, [cls, big, small]) {
    btn.className = 'big plate ' + cls;
    btn.querySelector('.bk').textContent = big;
    btn.querySelector('.bs').textContent = small;
  }
  function openPrompt(mode, q, kick) {
    promptMode = mode; promptQ = q;
    promptOpenedAt = Date.now();
    const d = QUESTIONS[q];
    const mins = Math.floor((Date.now() - active.start) / 60000);
    $('#pKick').textContent = mode === 'stop' ? 'Fahrt beenden' : kick || `${mins} Minuten unterwegs`;
    $('#pTitle').textContent = d.title;
    setBig($('#pA'), d.a); setBig($('#pB'), d.b);
    $('#pLater').textContent = mode === 'stop' ? (q === 'route' ? 'Weiterfahren' : 'Überspringen')
      : mode === 'auto' ? 'Später' : 'Abbrechen';
    $('#prompt').classList.add('open');
    if (mode === 'auto') chime();
  }
  function closePrompt() { $('#prompt').classList.remove('open'); promptMode = null; }

  // location prompts queue up so that one never replaces another that is still open
  function ask(q, kick) {
    if (!autoQueue.some(x => x.q === q)) autoQueue.push({ q, kick });
    pumpAsk();
  }
  function pumpAsk() {
    if (promptMode || stopQueue || !active) return;
    while (autoQueue.length) {
      const { q, kick } = autoQueue.shift();
      if (q === 'route' ? active.route === null : active.via === null) return openPrompt('auto', q, kick);
    }
  }

  [$('#pA'), $('#pB')].forEach(b => b.addEventListener('click', () => {
    if (Date.now() - promptOpenedAt < 450) return; // ignore accidental taps as it appears
    const mode = promptMode, yes = b.id === 'pA';
    if (promptQ === 'route') active.route = yes;
    else active.via = yes ? 'b10' : 'donautal';
    closePrompt();
    if (mode === 'stop') nextStopQuestion();
    else { persist(); render(); setTimeout(pumpAsk, 400); }
  }));
  $('#pLater').addEventListener('click', () => {
    const mode = promptMode, q = promptQ;
    if (mode === 'auto' && q === 'route') { active.snoozed = true; persist(); }
    closePrompt();
    if (mode === 'stop') {
      if (q === 'route') { stopAt = null; stopQueue = null; render(); } // keep driving
      else nextStopQuestion();                                         // save without B 10 / Donautal
    } else setTimeout(pumpAsk, 400);
  });

  // ---------- ticking ----------
  function tick() {
    const t = $('#timer');
    if (!active) { t.textContent = '00:00'; t.classList.remove('long'); return; }
    const el = Date.now() - active.start;
    t.textContent = fmtDur(el);
    t.classList.toggle('long', el >= 3600000);
    if (!promptMode && !stopQueue && active.route === null && !active.snoozed && el >= PROMPT_AFTER_MS) {
      // no fix within 7 minutes → give up on location for this ride
      if (geoOn && active.from === null) { active.from = 'none'; persist(); geoSync(); renderGeo(); }
      // the time-based prompt is only the fallback when location can't tell where we are
      if (!geoGuides()) openPrompt('auto', 'route');
    }
  }
  setInterval(tick, 500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (active) { wake(); if (geoWanted()) geoSample(); } // catch up right away after the screen was off
    tick();
  });

  // ---------- rendering ----------
  const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const routeTag = r => r ? '<span class="tag r">Risstissen</span>' : '<span class="tag d">Direkt</span>';
  const viaTag = v => v === 'b10' ? '<span class="tag w">B 10</span>' : v === 'donautal' ? '<span class="tag s">Donautal</span>' : '';

  function renderGeo() {
    $('#geoBtn').setAttribute('aria-checked', String(geoOn));
    const line = $('#geoLine');
    line.hidden = !(active && geoOn);
    if (line.hidden) return;
    let t;
    if (active.from === null) t = 'Standort wird gesucht …';
    else if (isOrigin(active.from)) {
      const next = pendingChecks()[0];
      t = dirName(active.from) + (next ? ` · fragt ${next.at}` : '');
    } else t = active.from === 'other' ? 'Start weder Ulm noch Unterstadion' : 'Kein Standort';
    $('#geoText').textContent = t;
  }

  function render() {
    document.body.classList.toggle('running', !!active);
    document.body.classList.toggle('idle', !active);
    $('#mainLbl').textContent = active ? 'Stopp' : 'Start';

    if (active) {
      $('#status').textContent = `Gestartet um ${fmtClock(active.start)}`;
    } else if (rides.length) {
      $('#status').textContent = `Letzte Fahrt: ${fmtDur(rides[0].end - rides[0].start)}, ${rides[0].risstissen ? 'über Risstissen' : 'direkt'}`;
    } else {
      $('#status').textContent = 'Bereit für die Fahrt';
    }

    const rb = $('#routeBtn');
    rb.className = 'route plate';
    if (active && active.route === true) { rb.classList.add('r', 'set'); rb.innerHTML = '<span class="k">über</span><span class="n">Risstissen</span>'; }
    else if (active && active.route === false) { rb.classList.add('d', 'set'); rb.innerHTML = '<span class="k">ohne Risstissen</span><span class="n">Direkt</span>'; }
    else rb.innerHTML = '<span class="k">Antippen zum Wählen</span><span class="n">Route offen</span>';

    const vb = $('#viaBtn');
    const showVia = !!active && (active.from === 'unterstadion' || isVia(active.via));
    vb.hidden = !showVia;
    $('#routes').classList.toggle('two', showVia);
    vb.className = 'route plate';
    if (active && active.via === 'b10') { vb.classList.add('w', 'set'); vb.innerHTML = '<span class="k">über</span><span class="n">B 10</span>'; }
    else if (active && active.via === 'donautal') { vb.classList.add('s', 'set'); vb.innerHTML = '<span class="k">über</span><span class="n">Donautal</span>'; }
    else vb.innerHTML = '<span class="k">B 10 / Donautal</span><span class="n">Offen</span>';

    renderGeo();
    geoSync();
    tick();
    renderStats();
    renderList();
  }

  function stats(list) {
    if (!list.length) return null;
    const d = list.map(r => r.end - r.start);
    return { n: d.length, avg: d.reduce((a, b) => a + b, 0) / d.length, min: Math.min(...d), max: Math.max(...d) };
  }
  function fillStat(key, s) {
    $('#avg' + key).innerHTML = s ? `<small>Ø</small>${fmtDur(s.avg)}` : '–';
    $('#meta' + key).innerHTML = s
      ? `${s.n} ${s.n === 1 ? 'Fahrt' : 'Fahrten'}<dl><dt>Schnellste</dt><dd>${fmtDur(s.min)}</dd><dt>Langsamste</dt><dd>${fmtDur(s.max)}</dd></dl>`
      : 'Noch keine Fahrten';
  }
  function fillDelta(el, a, b, lead, tail) {
    el.hidden = !(a && b);
    if (el.hidden) return;
    const diff = a.avg - b.avg;
    el.innerHTML = Math.abs(diff) < 1000
      ? 'Beide Wege sind im Schnitt gleich schnell.'
      : `${lead} bist du im Schnitt <b>${fmtDur(Math.abs(diff))} ${diff > 0 ? 'langsamer' : 'schneller'}</b>${tail}.`;
  }
  function renderStats() {
    const sR = stats(rides.filter(r => r.risstissen));
    const sD = stats(rides.filter(r => !r.risstissen));
    fillStat('R', sR); fillStat('D', sD);
    fillDelta($('#delta'), sR, sD, 'Über Risstissen', '');

    const withVia = rides.filter(r => isVia(r.via));
    $('#viaStats').hidden = !withVia.length;
    if (!withVia.length) return;
    const sB = stats(withVia.filter(r => r.via === 'b10'));
    const sT = stats(withVia.filter(r => r.via === 'donautal'));
    fillStat('B', sB); fillStat('T', sT);
    fillDelta($('#deltaV'), sB, sT, 'Über die B 10', ' als durchs Donautal');
  }
  function renderList() {
    const list = $('#list');
    list.textContent = '';
    if (!rides.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'Noch keine Fahrten gespeichert. Tippe oben auf Start, wenn du losfährst.';
      list.appendChild(e); return;
    }
    const frag = document.createDocumentFragment();
    for (const r of rides) {
      const b = document.createElement('button');
      b.className = 'ride ' + (r.risstissen ? 'r' : 'd'); b.dataset.id = r.id;
      b.innerHTML = `
        <div><div class="rdate"></div><div class="rtime"></div>${isOrigin(r.from) ? '<div class="rdir"></div>' : ''}</div>
        <div class="rright"><div class="rdur"></div>${routeTag(r.risstissen)}${viaTag(r.via)}</div>${ICON_CHEV}`;
      b.querySelector('.rdate').textContent = fmtDate(r.start);
      b.querySelector('.rtime').textContent = `${fmtClock(r.start)} – ${fmtClock(r.end)}`;
      if (isOrigin(r.from)) b.querySelector('.rdir').textContent = dirName(r.from);
      b.querySelector('.rdur').textContent = fmtDur(r.end - r.start);
      b.addEventListener('click', () => openSheet(r.id));
      frag.appendChild(b);
    }
    list.appendChild(frag);
  }

  // ---------- edit sheet ----------
  let sheetId = null;
  function openSheet(id) {
    const r = rides.find(x => x.id === id); if (!r) return;
    sheetId = id;
    $('#sTitle').textContent = fmtDur(r.end - r.start);
    $('#sSub').textContent = `${fmtDate(r.start)}, ${fmtClock(r.start)} – ${fmtClock(r.end)}` +
      (isOrigin(r.from) ? ` · ${dirName(r.from)}` : '');
    syncSeg(r);
    $('#sheet').classList.add('open');
  }
  function syncSeg(r) {
    document.querySelectorAll('#sSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === r.risstissen));
    $('#sSegV').hidden = !(r.from === 'unterstadion' || isVia(r.via));
    document.querySelectorAll('#sSegV button').forEach(b => b.classList.toggle('on', b.dataset.v === r.via));
  }
  document.querySelectorAll('#sSeg button').forEach(b => b.addEventListener('click', () => {
    const r = rides.find(x => x.id === sheetId); if (!r) return;
    r.risstissen = b.dataset.v === '1'; syncSeg(r); persist(); render();
  }));
  document.querySelectorAll('#sSegV button').forEach(b => b.addEventListener('click', () => {
    const r = rides.find(x => x.id === sheetId); if (!r) return;
    if (r.via === b.dataset.v) delete r.via; else r.via = b.dataset.v;   // tap again to clear
    syncSeg(r); persist(); render();
  }));
  $('#sDel').addEventListener('click', () => {
    if (!confirm('Fahrt wirklich löschen?')) return;
    rides = rides.filter(x => x.id !== sheetId); persist(); closeSheet(); render();
  });
  const closeSheet = () => { $('#sheet').classList.remove('open'); sheetId = null; };
  $('#sClose').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

  // ---------- toast ----------
  let toastTimer;
  function hideToast() { $('#toast').classList.remove('show'); }
  function toast(msg, label, action) {
    $('#toastMsg').textContent = msg;
    const b = $('#toastBtn');
    if (label) { b.textContent = label; b.hidden = false; b.onclick = () => { hideToast(); action(); }; }
    else b.hidden = true;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, label ? 7000 : 2600);
  }

  // ---------- export / backup ----------
  async function shareFile(name, text, type) {
    const file = new File([text], name, { type });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);

  $('#csvBtn').addEventListener('click', () => {
    if (!rides.length) return toast('Noch keine Fahrten');
    const rows = [['Datum', 'Start', 'Ende', 'Dauer', 'Dauer (min)', 'Route', 'Richtung', 'Einfahrt Ulm']];
    for (const r of [...rides].reverse()) {
      rows.push([
        new Date(r.start).toLocaleDateString('de-DE'), fmtClock(r.start), fmtClock(r.end),
        fmtDur(r.end - r.start), ((r.end - r.start) / 60000).toFixed(1).replace('.', ','),
        r.risstissen ? 'Über Risstissen' : 'Ohne Risstissen',
        isOrigin(r.from) ? dirName(r.from) : '',
        r.via === 'b10' ? 'B 10' : r.via === 'donautal' ? 'Donautal' : ''
      ]);
    }
    shareFile(`fahrzeiten-${stamp()}.csv`, '﻿' + rows.map(r => r.join(';')).join('\n'), 'text/csv');
  });
  $('#backupBtn').addEventListener('click', () => {
    const data = { app: 'fahrzeit', version: 2, exported: new Date().toISOString(), rides };
    shareFile(`fahrzeit-backup-${stamp()}.json`, JSON.stringify(data, null, 2), 'application/json');
  });
  $('#restoreBtn').addEventListener('click', () => $('#fileIn').click());
  $('#fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = (Array.isArray(data) ? data : data.rides || []).filter(r =>
        r && typeof r.start === 'number' && typeof r.end === 'number' && r.end > r.start && typeof r.risstissen === 'boolean');
      const known = new Set(rides.map(r => r.id));
      let added = 0;
      for (const r of incoming) {
        const id = r.id || uid();
        if (known.has(id)) continue;
        const ride = { id, start: r.start, end: r.end, risstissen: r.risstissen };
        if (isOrigin(r.from)) ride.from = r.from;
        if (isVia(r.via)) ride.via = r.via;
        rides.push(ride); known.add(id); added++;
      }
      rides.sort((a, b) => b.start - a.start);
      persist(); render();
      toast(`${added} Fahrten importiert`);
    } catch { toast('Datei konnte nicht gelesen werden'); }
  });

  // ---------- boot ----------
  render();
  if (active) wake();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
